      if (R.reciprocity && xa2.otherStateLicense === "y")
        body += "<p class='rm-note'>" + esc(d.recipNote) +
          ' <a target="_blank" rel="noopener" href="' + R.reciprocity.source.url + '">' +
          esc(R.reciprocity.source.title) + " ↗</a></p>";
      if (R.examWindowMonths && xa2.appAcceptedAt && !(xa2.lawStatus === "x_pass" && xa2.tradeStatus === "x_pass")) {
        var xdl = addMonths(xa2.appAcceptedAt, R.examWindowMonths);
        body += "<p class='rm-note'>" + esc(fill(d.examWindowNote, { d: xdl ? fmtDate(xdl) : "?" })) +
          ' <a target="_blank" rel="noopener" href="' + R.examWindowSource.url + '">' + esc(R.examWindowSource.title) + " ↗</a></p>";
      }
    }
    if (s.key === "fingerprinting" && (RM.answers || {}).fingerStatus === "fp_sched")
      body += whenWhere(d.dateKindFp, RM.answers.fingerSchedAt, RM.answers.fingerWhere);
    // step-specific extra precise links (config, checked live)
    var extraSrc = [];
    if (s.key === "application_review" && R.processingTimes) extraSrc.push(R.processingTimes);
    if (s.key === "final_requirements") {
      // what applies to THIS applicant, each with its source
      var fk = finalKeys(RM.answers || {}), FS = R.finalSources || {};
      if (fk.length)
        body += "<p class='rm-h'>" + esc(d.finalAppliesH) + "</p><ul class='rm-final-l'>" + fk.map(function (k) {
          var src = FS[k] || (k === "wc" ? R.wcSource : k === "asbestos" ? R.asbestosSource : k === "bond" ? R.bondSource : null);
          return "<li>" + esc(d["fi_" + k]) + (src ? ' <a target="_blank" rel="noopener" href="' + src.url + '">' + esc(src.title) + " ↗</a>" : "") + "</li>";
        }).join("") + "</ul>";
      if (R.asbestosSource) {
        var az = R.asbestosSource;
        body += "<p class='rm-note'>" + esc(d.asbNote) +
          ' <a target="_blank" rel="noopener" href="' + az.url + '">' + esc(az.title) + " ↗</a></p>";
      }
      if (R.llcSource && (RM.answers || {}).entity === "llc") {
        var lls = R.llcSource;
        body += "<p class='rm-note'>" + esc(d.rtw_llcNote) +
          ' <a target="_blank" rel="noopener" href="' + lls.url + '">' + esc(lls.title) + " ↗</a></p>";
      }
      if (R.bondSource) extraSrc.push(R.bondSource);
      if (R.wcSource) extraSrc.push(R.wcSource);
    }
    extraSrc.forEach(function (x) {
      if (x.url === src.url) return;   // the step's own source is printed once, below
      body += '<a class="rm-src" target="_blank" rel="noopener" href="' + x.url + '">' + esc(x.title) + " ↗</a>";
    });
    body += '<a class="rm-src" target="_blank" rel="noopener" href="' + src.url + '">' +
      esc(d.officialSrc) + ": " + esc(src.title) + " ↗ <span class='rm-src-v'>(" + esc(fill(d.srcVerified, { d: src.verified })) + ")</span></a>";
    // actions
    body += '<div class="rm-actions">';
    if (st !== "completed" && s.confirmable)
      // major milestones confirm with an explicit, context-specific label
      // ("Yes, my license has been issued") — ordinary steps keep the generic one
      body += '<button class="btn btn-primary rm-done">' + esc(d["mc_" + s.key] || d.markComplete) + "</button>";
    if (st === "completed")
      body += '<span class="rm-done-lbl">' + esc(d.markedDone) + "</span>";
    body += '<select class="rm-status" aria-label="' + esc(d.updateStatus) + '">' +
      STATUS_SET.map(function (v) { return '<option value="' + v + '"' + (v === st ? " selected" : "") + ">" + esc(d["s_" + v]) + "</option>"; }).join("") +
      "</select></div>";
    // a hand-set status is the user's own mark — LICENA checks nothing with the agency (§2)
    if (RM.steps[s.key].manual) body += "<p class='rm-manual'>" + esc(d.manualNote) + "</p>";
    // correcting an event mark: confirm first; the actual state is then
    // stated in the questionnaire, nothing is saved before that (§2–3)
    if (FIX && FIX.key === s.key)
      body += "<div class='rm-fix' role='group' aria-label='" + esc(d["fixQ_" + s.key] || "") + "'>" +
        "<p class='rm-fix-q'>" + esc(d["fixQ_" + s.key] || "") + "</p><p class='rm-note'>" + esc(d.fixNote) + "</p>" +
        "<div class='rm-appx'><button type='button' class='btn btn-primary rm-fix-go'>" + esc(d.fixGo) + "</button>" +
        "<button type='button' class='btn btn-ghost rm-fix-cancel'>" + esc(d.fixCancel) + "</button></div></div>";
    body += "</div>";
    card.innerHTML = headHtml + body;
    var bt = card.querySelector(".rm-expb-t");
    if (bt) {
      var pb = card.querySelector(".rm-expb");
      if (PANEL) { PANEL.box = pb; pb.hidden = false; bt.textContent = d.expCloseBuilder; bt.setAttribute("aria-expanded", "true"); paintPanel(); }
      bt.addEventListener("click", function () {
        if (!PANEL) { openBuilder(pb, bt); return; }
        PANEL = null; pb.hidden = true; pb.innerHTML = "";
        bt.textContent = d.expOpenBuilder; bt.setAttribute("aria-expanded", "false");
      });
    }

    card.querySelector(".rm-step-head").addEventListener("click", function () {
      var was = card.classList.contains("open");
      card.classList.toggle("open", !was);
      card.querySelector(".rm-step-head").setAttribute("aria-expanded", String(!was));
      // opening a card is a view, never a status change (§2); the choice is kept for the session
      if (OPEN) { if (was) delete OPEN[s.key]; else OPEN[s.key] = 1; saveOpen(); }
      if (!was) { track("license_roadmap_step_opened"); tag("roadmap_step", s.key); }
    });
    var doneBtn = card.querySelector(".rm-done");
    if (doneBtn) doneBtn.addEventListener("click", function () { setStatus(s.key, "completed"); });
    card.querySelectorAll(".rm-dba-b").forEach(function (b) {
      b.addEventListener("click", function () {
        (RM.answers || (RM.answers = {})).dba = b.getAttribute("data-dba");
        persist(RM); renderRoadmap(s.key, true);
      });
    });
    card.querySelector(".rm-status").addEventListener("change", function (e) { setStatus(s.key, e.target.value); });
    var fixGo = card.querySelector(".rm-fix-go");
    if (fixGo) fixGo.addEventListener("click", function () { FIX = null; editAnswers(eventUnitId(s.key)); });
    var fixNo = card.querySelector(".rm-fix-cancel");
    if (fixNo) fixNo.addEventListener("click", function () { FIX = null; renderRoadmap(s.key, true); });
    var cta = card.querySelector(".rm-cta");
    if (cta) cta.addEventListener("click", function () { track("license_exam_prep_clicked"); tag("roadmap_step", s.key); });
    return card;
  }

  function setStatus(key, status) {
    if (STATUS_SET.indexOf(status) < 0) return;
    var cur = RM.steps[key].status;
    // A card that reports an EVENT (submitted / accepted / Live Scan done /
    // exams passed / license issued) going back from "completed" is not a
    // progress mark but a correction of a fact: confirm first, then the
    // actual state is stated in the questionnaire — nothing is saved until
    // then (owner spec 2026-09-11 §2–3)
    if (RML.isEventStep(key) && cur === "completed" && status !== "completed") {
      FIX = { key: key };
      renderRoadmap(key, true);
      return;
    }
    FIX = null;
    RM.steps[key].status = status;
    RM.steps[key].completed_at = status === "completed" ? new Date().toISOString() : null;
    RM.steps[key].manual = true;   // the user's own mark, kept apart from what the answers derive
    if (status === "completed") {
      track("license_roadmap_step_completed");
      // manual milestone confirmations feed the same v2 answers the intake
      // collects, so the dashboard and recommendations stay consistent
      var a = RM.answers || (RM.answers = {});
      // the stage the questionnaire shows follows the same fact, so a later
      // correction starts from what the card said (spec 2026-09-11 §5)
      if (key === "license_issued") { a.issued = "y"; if (a.appSubmitted === "a_yes") a.appStage = "stg_issued"; }
      if (key === "submit_application" && a.appSubmitted !== "a_yes") {
        a.appSubmitted = "a_yes"; if (!a.appStatus) a.appStatus = "st_waiting"; if (!a.appStage) a.appStage = "stg_waiting";
      }
      if (key === "application_review") { a.appSubmitted = "a_yes"; a.appStatus = "st_accepted"; a.appStage = "stg_acc"; }
      if (key === "fingerprinting") a.fingerStatus = "fp_done";
      // an explicit "Yes, I passed all required exams": only exams still open
      // become passed; a confirmed waiver or a classification without a trade
      // exam is left alone
      if (key === "schedule_pass_exams") {
        if (!RML.examDone(a.lawStatus)) a.lawStatus = "x_pass";
        if (tradeReq(RM.trade) && !RML.examDone(a.tradeStatus)) a.tradeStatus = "x_pass";
      }
    }
    persist(RM);
    renderRoadmap(key, true);
  }

  /* A stored "YYYY-MM-DD" is a calendar day, not an instant: format it in UTC
     so it never shows as the day before west of Greenwich. */
  function fmtDate(iso) {
    var t = RML.parseDate(iso);
    if (!t) return iso;
    return t.toLocaleDateString(LOCALE, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }
  function whenWhere(label, dt, where) {
    if (!dt && !where) return "";
    return "<p class='rm-note'>" + esc(label) + ": " + (dt ? "<b>" + esc(fmtDate(dt)) + "</b>" : "") +
      (where ? (dt ? " · " : "") + esc(where) : "") + "</p>";
  }

  /* inPlace: an ANSWER on the roadmap view (status change, ready-to-work
     tick) re-renders where the user stands; only real transitions (finishing
     the wizard, resuming from the intro) go back to the top. */
  function renderRoadmap(keepOpen, inPlace) {
    track("license_roadmap_viewed");
    var wasV5 = (RM.answers || {}).intakeV >= 5;
    var a = migrate(RM.answers || {}); RM.answers = a;
    rederive(RM);              // statuses always follow the answers (hand-set marks kept)
    if (!wasV5) saveLocal(RM); // keep the local mirror current after a one-time migration
    var pct = progressOf(RM);
    // a hand-set event mark that contradicts the answers is resolved first —
    // nothing downstream (readiness, next step, the summary) is assumed from
    // it: the view reads the answers with the contested fact masked (§7)
    var cf = RML.eventConflicts(RM.steps, a, tradeReq(RM.trade));
    a = maskContested(a, cf);
    var f = subFlags(a);
    var rec = cf.length ? conflictRec(cf[0]) : recommendNext(RM);
    // ONE logic: the recommended step is also where the marker sits and what
    // the button opens (owner spec 2026-09-10 §1)
    var here = rec ? rec.key : currentStepOf(RM);
    var viewKey = here;
    // applicable stages for this branch (a classification without a trade
    // exam has no trade-prep stage) — "X of Y completed", never a made-up percent
    var applicable = STEPS.filter(function (s) { return s.key !== "prep_trade" || tradeReq(RM.trade); });
    var doneN = applicable.filter(function (s) { return RM.steps[s.key] && RM.steps[s.key].status === "completed"; }).length;
    if (!OPEN) {
      var stored = DEMO ? null : loadOpen();
      OPEN = {};
      (stored || [here]).forEach(function (k) { OPEN[k] = 1; });
    }
    if (keepOpen) OPEN[keepOpen] = 1;
    if (PANEL) OPEN.experience = 1;
    var el = document.createElement("div");

    var when = new Date(RM.updatedAt);
    var dateStr = when.toLocaleDateString(lang === "ru" ? "ru-RU" : lang === "es" ? "es-ES" : "en-US", { month: "short", day: "numeric" });
    var hero = document.createElement("div"); hero.className = "rm-hero";
    hero.innerHTML = "<div class='eyebrow'>" + esc(d.stateName) + " · " + esc(d.tag) + (RM.trade ? " · " + esc(tradeName(RM.trade)) : "") + "</div>" +
      "<h1>" + esc(d.rmTitle) + "</h1>" +
      '<div class="rm-journey"><span>' + esc(d.journeyL) + "</span><strong>" + esc(fill(d.pctDone, { p: pct })) + "</strong></div>" +
      '<div class="rm-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="rm-meta">' + esc(fill(d.lastUpdated, { d: dateStr })) + " · " +
      (DEMO ? esc(d.demoNote) : (session ? esc(d.savedNote) : esc(d.localNote))) + "</div>" +
      (d["t_" + here] ? '<div class="rm-pos">' + esc(fill(d.posLbl, { stage: d["t_" + here] })) + "</div>" : "");
    el.appendChild(hero);

    // DASHBOARD (spec §26): the situation readable in seconds — license,
    // entity, position, next important date + mini statuses + progress.
    var nd = nextDate(a);
    function exCell(stx, dt) {
      if (stx === "x_pass") return "✓ " + esc(d.s_completed);
      if (stx === "x_waived") return "✓ " + esc(d.x_waived);
      if (stx === "x_wreq") return esc(d.x_wreq);
      if (stx === "x_sched") return dt ? esc(fmtDate(dt)) : esc(d.x_sched);
      if (stx === "x_fail") return esc(d.x_fail);
      return esc(d.dashNone);
    }
    function expCell(x) {
      var yrs = R.experience.years;
      if ((x.exp || []).length) {
        var r = expReadiness(x.exp, x);
        var stx = r.clarifyMonths > 0 ? d.dashExpClarify
          : r.countingMonths >= yrs * 12 ? fill(d.dashExpMay, { years: yrs }) : fill(d.dashExpShort, { years: yrs });
        return esc(fill(d.dashExpClaimed, { dur: durText(r.claimedMonths) })) + "<span class='rm-dd'>" + esc(stx) + "</span>";
      }
      if (x.expQuick === "xq_yes") return esc(fill(d.dashExpYes, { years: yrs }));
      if (x.expQuick === "xq_no") return esc(fill(d.dashExpNo, { years: yrs }));
      if (x.expQuick === "xq_unsure") return esc(d.dashExpUnsure);
      return esc(d.dashExpNone);
    }
    var applyAs = a.entityName
      ? esc(a.entityName) + "<span class='rm-dd'>" + esc(d["ent_" + a.entity] || "") + "</span>"
      : (a.entity ? esc(d["ent_" + a.entity]) : esc(d.dashNone));
    var dash = document.createElement("div"); dash.className = "rm-dash";
    dash.innerHTML =
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashLicense) + "</span><strong>" + esc(tradeName(RM.trade) || d.dashNone) + "</strong></div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashAs) + "</span><strong>" + applyAs + "</strong></div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashPos) + "</span><strong>" + esc(d["t_" + here] || d.dashNone) + "</strong></div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashExp) + "</span><strong>" + expCell(a) + "</strong></div>" +
      "<div class='rm-dc rm-dc-date" + (nd && nd.over ? " rm-dc-over" : "") + "'><span class='rm-dk'>" + esc(d.dashNext) + "</span>" +
        (nd ? "<strong>" + esc(nd.label) + "</strong><span class='rm-dd'>" + esc(fmtDate(nd.date)) + " · " +
            esc(nd.over ? fill(d.daysOver, { n: nd.days }) : fill(d.daysLeft, { n: nd.days })) + "</span>" +
          (nd.over ? "" : nd.days <= 1 ? "<span class='rm-drem'>" + esc(d.rem1) + "</span>"
            : nd.days <= 7 ? "<span class='rm-drem'>" + esc(d.rem7) + "</span>"
            : nd.days <= 14 ? "<span class='rm-drem'>" + esc(d.rem14) + "</span>" : "")
          : "<strong>" + esc(d.dashNoDate) + "</strong><span class='rm-dd'>" + esc(d.dashNoDateSub) + "</span>") + "</div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashExams) + "</span>" +
        "<strong>" + esc(d.dashLaw) + ": " + exCell(a.lawStatus, a.lawDate) + "</strong>" +
        "<strong>" + esc(tradeName(RM.trade) || "Trade") + ": " + (tradeReq(RM.trade) ? exCell(a.tradeStatus, a.tradeDate) : esc(d.dashNotReq)) + "</strong></div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashApp) + "</span><strong>" +
        (f.submitted ? "✓ " + esc(d.dashSubmitted) + (f.accepted ? " · ✓ " + esc(d.dashAccepted) : "") : esc(d.dashNotSubmitted)) + "</strong></div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashFinger) + "</span><strong>" +
        esc(f.issued ? d.fp_done : (d[a.fingerStatus] || d.dashNone)) + "</strong></div>" +
      "<div class='rm-dc'><span class='rm-dk'>" + esc(d.dashProgress) + "</span><strong>" + pct + "%</strong>" +
        "<span class='rm-dd'>" + esc(fill(d.stagesDone, { x: doneN, y: applicable.length })) + "</span></div>";
    el.appendChild(dash);

    if (rec) {
      var next = document.createElement("div"); next.className = "rm-next";
      var inline = !rec.wait && !rec.par && rec.ctas.length;
      var nx = "<div class='rm-next-k'>" + esc(d.nextStepH) + "</div>" +
        "<h2>" + esc(rec.t) + "</h2><p>" + esc(rec.b) + "</p>";
      if (rec.key === "prepare_application" && R.assistant) {
        var apSum2 = null;
        try { apSum2 = JSON.parse(localStorage.getItem("lp:application:ca:summary") || "null"); } catch (_) {}
        var apReady = apSum2 && (apSum2.status === "ready_for_submission" || apSum2.status === "submitted_user_confirmed");
        nx += '<div class="rm-next-ctas"><a class="rm-app" href="application.html?lang=' + lang +
          (apReady ? "#review" : "") + '">' + esc(apReady ? d.rmAppReview : d.rmAppCta) + "</a></div>";
      }
      if (inline) nx += '<div class="rm-next-ctas">' + rec.ctas.join(" ") + "</div>";
      if (rec.src) nx += '<a class="rm-src" target="_blank" rel="noopener" href="' + rec.src.url + '">' +
        esc(d.officialSrc) + ": " + esc(rec.src.title) + " ↗</a>";
      if (rec.conflict)
        nx += "<div class='rm-appx rm-cf'><button type='button' class='btn btn-primary' id='rmCfYes'>" + esc(d["mc_" + rec.key] || d.markComplete) + "</button>" +
          "<button type='button' class='btn btn-ghost' id='rmCfNo'>" + esc(d.cf_no) + "</button></div><p class='rm-note'>" + esc(d.cf_note) + "</p>";
      nx += '<button class="btn btn-ghost" id="rmView">' + esc(d.viewStep) + "</button>" +
        "<p class='rm-next-note'>" + esc(d.recNote) + "</p>";
      next.innerHTML = nx;
      el.appendChild(next);
      if (rec.conflict) {
        // "yes, it happened": the card's fact is recorded the same way a fresh
        // mark records it; "no": a stale mark is dropped, a stale fact is
        // restated in the questionnaire — never guessed
        next.querySelector("#rmCfYes").addEventListener("click", function () { FIX = null; setStatus(rec.key, "completed"); });
        next.querySelector("#rmCfNo").addEventListener("click", function () {
          FIX = null;
          if (RM.steps[rec.key].status === "completed") { delete RM.steps[rec.key].manual; persist(RM); renderRoadmap(rec.key, true); }
          else editAnswers(eventUnitId(rec.key));
        });
      }
      // secondary track: exam prep while the application waits / in parallel
      if ((rec.wait || rec.par) && rec.ctas.length) {
        var wyw = document.createElement("div"); wyw.className = "rm-wyw";
        wyw.innerHTML = "<h3>" + esc(rec.wait ? d.wyw_h : d.par_h) + "</h3>" +
          "<p>" + esc(rec.wait ? d.wyw_b : d.par_b) + "</p>" +
          '<div class="rm-next-ctas">' + rec.ctas.join(" ") + "</div>";
        el.appendChild(wyw);
      }
    }

    var list = document.createElement("div"); list.className = "rm-list";
    STEPS.forEach(function (s) {
      if (s.key === here) {
        var hereEl = document.createElement("div"); hereEl.className = "rm-here"; hereEl.textContent = d.youAreHere + " ↓";
        list.appendChild(hereEl);
      }
      list.appendChild(stepCard(s, !!OPEN[s.key]));
    });
    el.appendChild(list);

    // READY TO WORK (spec §16–19): shown only once the license is issued;
    // items are conditional on entity/DBA/hiring; when all are checked the
    // roadmap ends with a neutral next-stage transition — and STOPS there.
    if (f.issued && !cf.length) {
      var items = rtwItems(a);
      var rtwState = a.rtw || (a.rtw = {});
      var rtwB = document.createElement("div"); rtwB.className = "rm-rtw"; rtwB.id = "rmRtw";
      rtwB.innerHTML = "<h3>" + esc(d.rtwH) + "</h3><p class='rm-rtw-i'>" + esc(d.rtwIntro) + "</p>";
      items.forEach(function (it) {
        var row = document.createElement("div"); row.className = "rm-rtw-it" + (rtwState[it.key] ? " done" : "");
        row.innerHTML = "<label class='rm-rtw-ck'><input type='checkbox'" + (rtwState[it.key] ? " checked" : "") + ">" +
          "<span><strong>" + esc(d["rtw_" + it.key + "_t"]) + "</strong><br>" + esc(d["rtw_" + it.key + "_b"]) +
          (it.key === "sos" && a.entity === "llc" ? " " + esc(d.rtw_llcNote) : "") +
          ' <a target="_blank" rel="noopener" href="' + it.source.url + '">' + esc(it.source.title) + " ↗</a></span></label>";
        row.querySelector("input").addEventListener("change", function (e) {
          rtwState[it.key] = e.target.checked; persist(RM);
          var openCard = root.querySelector(".rm-step.open");
          renderRoadmap(openCard ? openCard.getAttribute("data-step") : undefined, true);
        });
        rtwB.appendChild(row);
      });
      if (items.every(function (it) { return rtwState[it.key]; })) {
        var doneB = document.createElement("div"); doneB.className = "rm-rtw-done";
        doneB.innerHTML = "<strong>" + esc(d.rtwDoneH) + "</strong><br>" + esc(d.rtwDoneB);
        rtwB.appendChild(doneB);
      }
      el.appendChild(rtwB);
    }

    if (!session && !DEMO) {
      var save = document.createElement("div"); save.className = "rm-save";
      save.innerHTML = "<h3>" + esc(d.saveH) + "</h3><p>" + esc(d.saveB) + "</p>" +
        '<a class="btn btn-primary" href="/?lang=' + lang + '&src=roadmap#authwrap">' + esc(d.saveCta) + "</a>";
      el.appendChild(save);
    }
    var editB = document.createElement("button"); editB.className = "linkbtn rm-edit"; editB.textContent = d.rmEditAnswers;
    editB.addEventListener("click", function () { editAnswers(null); });
    el.appendChild(editB);
    var restart = document.createElement("button"); restart.className = "linkbtn rm-restart"; restart.textContent = d.introRestart;
    restart.addEventListener("click", function () {
      // an unfinished conversation is restored rather than thrown away
      W = { a: loadDraft() || {}, edit: null, reveal: null, errs: null };
      track("license_roadmap_started"); renderFlow();
    });
    el.appendChild(restart);

    var disc = document.createElement("p"); disc.className = "rw-disc"; disc.textContent = d.disclaimer; el.appendChild(disc);
    if (inPlace) {
      var keepY = window.scrollY;
      render(el, { keepScroll: true });
      if (window.scrollY !== keepY) window.scrollTo(0, keepY);
    } else render(el);
    el.querySelectorAll(".rm-next .rm-cta, .rm-wyw .rm-cta").forEach(function (c) {
      c.addEventListener("click", function () { track("license_exam_prep_clicked"); });
    });
    var vb = el.querySelector("#rmView");
    if (vb) vb.addEventListener("click", function () {
      if (rec && rec.rtw) {
        var rt = el.querySelector("#rmRtw");
        if (rt) { rt.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      }
      // classification is settled in the questionnaire — reopen that question with
      // every answer kept (§1)
      if (viewKey === "classification") { editAnswers("class"); return; }
      var target = el.querySelector('[data-step="' + viewKey + '"]');
      if (target) {
        if (!target.classList.contains("open")) target.querySelector(".rm-step-head").click();
        // the experience details live in the builder — open it straight away
        if (viewKey === "experience") {
          var xb = target.querySelector(".rm-expb-t");
          if (xb && xb.getAttribute("aria-expanded") !== "true") xb.click();
        }
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  }

  /* ---------- intro ---------- */
  function intro(hasSaved) {
    var el = document.createElement("div"); el.className = "rw-card rw-center rm-intro";
    el.innerHTML = "<div class='eyebrow'>" + esc(d.introKicker) + "</div>" +
      "<h1>" + esc(d.introH) + "</h1><p class='rw-sub'>" + esc(d.introSub) + "</p>";
    if (hasSaved) {
      var cont = document.createElement("button"); cont.className = "btn btn-primary"; cont.textContent = d.introResume;
      cont.addEventListener("click", function () { renderRoadmap(); });
      el.appendChild(cont);
      var re = document.createElement("button"); re.className = "linkbtn rm-restart"; re.textContent = d.introRestart;
      re.addEventListener("click", function () {
        W = { a: loadDraft() || {}, edit: null, reveal: null, errs: null };
        track("license_roadmap_started"); renderFlow();
      });
      el.appendChild(re);
    } else {
      var go = document.createElement("button"); go.className = "btn btn-primary"; go.textContent = d.introCta;
      go.addEventListener("click", function () { track("license_roadmap_started"); renderFlow(); });
      el.appendChild(go);
    }
    var disc = document.createElement("p"); disc.className = "rw-disc"; disc.textContent = d.disclaimer; el.appendChild(disc);
    return el;
  }

  /* Scrolling to the top is a SECTION-TRANSITION affordance only (Next/Back,
     intro, finishing the wizard). Answering a question re-renders in place via
     reWiz() and must never move the page — that was the owner-reported bug. */
  function render(el, opts) {
    root.innerHTML = ""; root.appendChild(el);
    if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
  }

  /* ---------- boot ---------- */
  function boot() {
    // The page's state decides availability BEFORE anything is asked, so an
    // unsupported state can never be shown California's requirements.
    if (!R.available) { render(stateUnavailable()); return; }
    document.title = d.pageTitle + " — LICENA";
    var tagEl = document.querySelector(".tag"); if (tagEl) tagEl.textContent = d.tag;
    if (DEMO) {
      /* Preview scenarios (owner spec §"Preview scenarios"). All data is
         SYNTHETIC. ?demo=1 keeps the previous default; ?demo=<key> opens one
         named scenario so every adaptive branch can be reviewed. */
      var day = function (n) { return RML.fmtDate(new Date(Date.now() + n * 864e5)); };
      var mo = function (n) { var t = new Date(); t.setUTCMonth(t.getUTCMonth() + n);
                              return t.toISOString().slice(0, 7); };
      var per = function (from, to, level, cert, rec) {
        return { employer: "Synthetic Builders", from: from, to: to, cap: "employee",
                 level: level, work: "Installed and serviced systems on residential jobs",
                 ft: "ft", certifier: cert, records: rec }; };
      var four = [per(mo(-60), mo(-12), "journeyman", "y", "y")];
      var thin = [per(mo(-20), mo(-2), "journeyman", "n", "n")];
      var base = { state: STATE, trade: "c20", intakeV: 3, hist: "h_none", holder: "me_sole",
                   entity: "sole_owner", dba: "n", otherStateLicense: "n", eduHas: "n",
                   military: "n", exp: four, expQuick: "xq_yes", appSubmitted: "a_no" };
      var ext = function (o) { var r = {}; Object.keys(base).forEach(function (k) { r[k] = base[k]; });
                               Object.keys(o).forEach(function (k) { r[k] = o[k]; }); return r; };
      var SCEN = {
        sole:        ext({}),
        llc:         ext({ holder: "existing_biz", entity: "llc", entityName: "Synthetic Systems LLC",
                           entityState: "CA", entityActive: "good", qualifySelf: "y" }),
        rme:         ext({ hist: "h_active", companyLicensed: "y", role: "r_owner_rme",
                           goal: "g_replace_rme", holder: "existing_biz", entity: "corporation",
                           entityName: "Synthetic Mechanical Inc.", entityState: "CA",
                           entityActive: "good", qualifySelf: "y", exp: thin }),
        rme_thin:    ext({ hist: "h_active", companyLicensed: "y", role: "r_owner_rme",
                           goal: "g_replace_rme", holder: "existing_biz", entity: "corporation",
                           entityName: "Synthetic Mechanical Inc.", entityActive: "good",
                           qualifySelf: "y", exp: thin }),
        rme_ready:   ext({ hist: "h_active", companyLicensed: "y", role: "r_owner_rme",
                           goal: "g_replace_rme", holder: "existing_biz", entity: "corporation",
                           entityName: "Synthetic Mechanical Inc.", entityActive: "good",
                           qualifySelf: "y", exp: four, rmeLeftAt: day(-10) }),
        family:      ext({ hist: "h_active", companyLicensed: "y", role: "r_employee",
                           familyMember: "y", familyActive5of7: "y", familyContinuity: "y",
                           sameClassAsLicense: "y", holder: "existing_biz", entity: "corporation",
                           entityName: "Synthetic Family Builders Inc.", entityActive: "good",
                           qualifySelf: "y" }),
        add_class:   ext({ hist: "h_active", role: "r_qual", goal: "g_add_class",
                           licenseNumber: "0000000", histClasses: "C-20" }),
        reciprocity: ext({ otherStateLicense: "y", otherStateId: "nv",
                           lawPassedWithinYears: "n" }),
        correction:  ext({ appSubmitted: "a_yes", appStatus: "st_correction", corrAt: day(-15),
                           appNumber: "SYN-000", fingerStatus: "fp_req" }),
        issued:      ext({ appSubmitted: "a_yes", appStatus: "st_accepted",
                           appAcceptedAt: day(-400), issued: "y", issuedAt: day(-20),
                           newLicenseNumber: "0000000", fingerStatus: "fp_done",
                           lawStatus: "x_pass", tradeStatus: "x_pass", bond: "b_have",
                           wc: "w_notreq", asbestos: "az_yes", employees: "emp_no" }),
        exams:       ext({ appSubmitted: "a_yes", appStatus: "st_accepted",
                           appAcceptedAt: day(-60), issued: "n", fingerStatus: "fp_done",
                           lawStatus: "x_pass", tradeStatus: "x_sched", tradeDate: day(21),
                           holder: "existing_biz", entity: "corporation",
                           entityName: "Synthetic Mechanical Inc.", entityActive: "good",
                           qualifySelf: "y", hist: "h_none" })
      };
      W.a = SCEN[DEMO_KEY] || SCEN.exams;
      RM = newModel(W.a);
      renderRoadmap();
      return;
    }
    var ready = (typeof supa !== "undefined")
      ? supa.auth.getSession().then(function (r) { session = (r.data || {}).session || null; }).catch(function () {})
      : Promise.resolve();
    ready.then(function () { return dbLoad(); }).then(function (m) {
      if (m) { RM = m; saveLocal(m); render(intro(true)); return; }
      var draft = loadDraft();
      if (draft) {
        // the plan this conversation was opened from, if any: it gives the
        // way back without saving and keeps the edit on the same saved plan
        RM = loadLocal();
        // the questionnaire was left half-answered: resume the conversation
        // exactly where it stood, dynamic questions included. A draft is a
        // v3+ conversation, never a v1 plan: the v1→v2 mapping must not run
        // on it (it would invent "not submitted" and exam statuses); only the
        // v4 field normalisation applies.
        if (!(draft.intakeV >= 2)) draft.intakeV = 3;
        W.a = migrate(draft); renderFlow(); return;
      }
      var local = loadLocal();
      if (local) {
        RM = local;
        if (session) dbSave(RM); // first visit after signing in: adopt the local roadmap
        render(intro(true)); return;
      }
      render(intro(false));
    });
  }
  boot();
})();

</script>
<script>
(function () {
  var sel = document.getElementById("pvScen");
  if (!sel) return;
  var q0 = new URLSearchParams(location.search);
  var st0 = q0.get("state");
  sel.value = (st0 === "az" || st0 === "nv") ? st0 : (q0.get("demo") || "");
  sel.addEventListener("change", function () {
    var q = new URLSearchParams(location.search);
    q.delete("demo"); q.delete("state");
    if (sel.value === "az" || sel.value === "nv") { q.set("state", sel.value); try { localStorage.removeItem("lp:roadmap:" + sel.value + ":draft"); } catch (_e) {} }
    else if (sel.value) q.set("demo", sel.value);
    // the questionnaire options start a fresh draft for their state
    else { try { localStorage.removeItem("lp:roadmap:ca:draft"); } catch (_e) {} }
    location.search = q.toString();
  });
})();
</script>
