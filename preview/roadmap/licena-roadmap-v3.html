<script>
/* LICENA — License Roadmap: PURE LOGIC (no DOM, no network, no i18n).
   Split out of app-roadmap.js for intake V3 so every rule the owner spec asks
   to verify is testable from node (scripts/test-roadmap-v3.mjs) against the
   SAME code the browser runs — not a copy.

   Two hard boundaries this file exists to hold:
   1. It NEVER decides eligibility. It counts what the user typed and reports
      what is missing; whether experience qualifies, whether a waiver applies
      and whether an exam is required are the licensing agency's calls. Every
      exported name says "candidate", "claimed" or "may" for that reason.
   2. It NEVER invents a rule. Numbers come from roadmap-config.js, which
      carries the official source and the date it was read; when a rule was not
      verified the config says UNKNOWN and the function returns null.

   Loads as a plain browser script (window.RML) and as a node module. */
(function (root, factory) {
  var api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  root.RML = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  /* ── Calendar ─────────────────────────────────────────────────────────────
     Date-only values are calendar facts, not instants. Everything below stays
     in UTC end to end: "YYYY-MM-DD" is parsed with Date.UTC and written back
     with the UTC getters. The v2 code mixed a UTC-parsed date with the LOCAL
     setDate/setMonth, which shifted every derived deadline by a day for anyone
     west of UTC (i.e. the entire audience) and shifted it inconsistently
     across DST. Tests cover DST, leap day and end-of-month. */

  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;

  function parseDate(iso) {
    var m = DATE_RE.exec(String(iso || ""));
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var t = Date.UTC(y, mo - 1, d);
    var dt = new Date(t);
    // rejects 2026-02-30 and friends
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return dt;
  }

  function fmtDate(dt) {
    if (!dt) return null;
    var y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, d = dt.getUTCDate();
    return y + "-" + (m < 10 ? "0" : "") + m + "-" + (d < 10 ? "0" : "") + d;
  }

  function addDays(iso, n) {
    var dt = parseDate(iso); if (!dt) return null;
    return fmtDate(new Date(dt.getTime() + n * 864e5));
  }

  /* Calendar months, clamped to the end of the target month: 2026-01-31 + 1
     month is 2026-02-28, never 2026-03-03. */
  function addMonths(iso, n) {
    var dt = parseDate(iso); if (!dt) return null;
    var y = dt.getUTCFullYear(), m = dt.getUTCMonth() + n, d = dt.getUTCDate();
    var last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return fmtDate(new Date(Date.UTC(y, m, Math.min(d, last))));
  }

  function daysBetween(fromIso, toIso) {
    var a = parseDate(fromIso), b = parseDate(toIso);
    if (!a || !b) return null;
    return Math.round((b.getTime() - a.getTime()) / 864e5);
  }

  /* ── Month indexes (the Experience Builder works at month precision) ────── */

  var MONTH_RE = /^(\d{4})-(\d{2})$/;

  function monthIndex(ym) {
    var m = MONTH_RE.exec(String(ym || ""));
    if (!m) return null;
    var mo = +m[2];
    if (mo < 1 || mo > 12) return null;
    return +m[1] * 12 + (mo - 1);
  }

  function monthIndexOf(dateIso) {
    var dt = parseDate(dateIso); if (!dt) return null;
    return dt.getUTCFullYear() * 12 + dt.getUTCMonth();
  }

  /* ── Experience Builder ───────────────────────────────────────────────────
     A period is {from:"YYYY-MM", to:"YYYY-MM"|"current", level, cap, ft, ...}.

     LEVEL and WORKING ARRANGEMENT are different questions, and CSLB keeps them
     apart (Certification of Work Experience 13A-11, rev. 12/2024, read
     2026-09-05). The form names exactly four levels — journeyman, foreman,
     supervising employee, contractor (T16 CCR 825) — and then says separately
     that an "owner-builder" or a "self-employed individual" "must have the
     knowledge and skills of a journeyman". Being self-employed or owning the
     business is therefore HOW someone worked, never a level by itself, and it
     is never treated here as journey-level on its own.

     "helper" is offered in the UI precisely so a user can enter honest history
     that does NOT count (the form defines a journeyman "as opposed to a
     trainee"). */

  var COUNTING_LEVELS = ["journeyman", "foreman", "supervising", "contractor"];

  /* Values an earlier build offered in the LEVEL list, where a working
     arrangement had been mixed in. Saved answers keep them verbatim — they are
     neither deleted nor re-read as a level: the UI asks the user to restate
     the level, and until then the period is reported as "needs clarification"
     instead of being silently counted or silently dropped. */
  var LEGACY_ARRANGEMENT_LEVELS = ["owner_builder", "self_employed"];
  /* Working arrangements where the applicant worked for themselves. With no
     licence history this is CSLB's own setting "non-licensed self-employment"
     (Acceptable Supporting Experience Documentation, read 2026-09-10) — a
     SETTING, never the "contractor" level, which CSLB defines as a current or
     former licensed California contractor, personnel of record on a
     California licence, or an out-of-state licensed contractor ("Qualifying
     Experience for the Examination", read 2026-09-10). */
  var SELF_CAPS = ["self", "owner", "own_property"];
  function isSelfSetting(cap) { return SELF_CAPS.indexOf(cap) >= 0; }

  function isCountingLevel(level, list) { return (list || COUNTING_LEVELS).indexOf(level) >= 0; }
  /* A period copied from another state's questionnaire arrives WITHOUT a
     level (each state names its levels differently) and is likewise reported
     as "needs clarification" until the user restates it. */
  function needsLevelReview(p) {
    return !!p && (LEGACY_ARRANGEMENT_LEVELS.indexOf(p.level) >= 0 || (!!p.imported && !p.level));
  }

  /* One period's PRELIMINARY standing — counts and buckets, never a verdict
     (CSLB decides what qualifies):
       "counting"    — journeyman / foreman / supervising employee; "contractor"
                       WITH a licence history; or self-employment the applicant
                       describes as journey-level work (jl = "y": done on their
                       own, without training or constant supervision, as a
                       fully qualified worker — CSLB's journeyman definition);
       "clarify"     — the level or the work is not settled yet: a legacy or
                       imported level, "contractor" with no licence history
                       (working for yourself is not licensed contracting), or
                       self-employment answered "not sure" / not answered.
                       Such months are reported as NEEDING CLARIFICATION, never
                       silently as zero;
       "not_journey" — trainee/helper, or self-employment answered "no". */
  function periodStanding(p, opts) {
    opts = opts || {};
    var levels = opts.countingLevels || COUNTING_LEVELS;
    var licHist = opts.licenseHistory !== false;
    if (!p || needsLevelReview(p)) return "clarify";
    if (p.level) {
      if (p.level === "contractor" && !licHist) return "clarify";
      return isCountingLevel(p.level, levels) ? "counting" : "not_journey";
    }
    if (isSelfSetting(p.cap) && p.jl) return p.jl === "y" ? "counting" : p.jl === "n" ? "not_journey" : "clarify";
    return "clarify";
  }

  /* [startIdx, endIdx] inclusive, or null when the period is unusable. */
  function periodRange(p, nowMonthIdx) {
    if (!p) return null;
    var s = monthIndex(p.from);
    if (s === null) return null;
    var e = (p.to === "current" || !p.to) ? nowMonthIdx : monthIndex(p.to);
    if (e === null || e < s) return null;
    return [s, e];
  }

  /* Union of inclusive month ranges — overlapping AND touching ranges merge,
     so the same calendar month is never counted twice (spec: "do not
     double-count overlapping calendar time"). */
  function mergeRanges(ranges) {
    var sorted = ranges.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    var out = [];
    for (var i = 0; i < sorted.length; i++) {
      var r = sorted[i], last = out[out.length - 1];
      if (last && r[0] <= last[1] + 1) { if (r[1] > last[1]) last[1] = r[1]; }
      else out.push([r[0], r[1]]);
    }
    return out;
  }

  function rangeMonths(ranges) {
    var n = 0;
    for (var i = 0; i < ranges.length; i++) n += ranges[i][1] - ranges[i][0] + 1;
    return n;
  }

  /* True when any two raw ranges share a month (a real overlap, not merely
     adjacent periods) — surfaced as a warning so the user can fix the dates. */
  function hasOverlap(ranges) {
    var sorted = ranges.slice().sort(function (a, b) { return a[0] - b[0]; });
    for (var i = 1; i < sorted.length; i++)
      if (sorted[i][0] <= sorted[i - 1][1]) return true;
    return false;
  }

  /* Evidence-readiness view. Returns COUNTS and FLAGS only — never a verdict.
     `windowYears` is the official look-back. Two shapes exist:
       - all of it inside the window (California: four years within the last
         ten) — the estimate is the clipped total;
       - a total with a MINIMUM inside the window (Arizona: four years, at
         least two of them within the last ten, A.R.S. 32-1122(E)(1)) —
         `minWithinYears` set; the estimate is the whole total and the part
         inside the window is reported next to it.
     `countingLevels` names the state's own levels (default: California's). */
  function experienceReadiness(periods, opts) {
    opts = opts || {};
    var nowIdx = opts.nowMonthIdx !== undefined && opts.nowMonthIdx !== null
      ? opts.nowMonthIdx : monthIndexOf(fmtDate(new Date()));
    var windowYears = opts.windowYears || null;
    var minWithin = opts.minWithinYears || null;
    var levels = opts.countingLevels || COUNTING_LEVELS;
    var licHist = opts.licenseHistory !== false;
    var list = (periods || []).filter(Boolean);

    var counting = [], partTime = [], clarify = [], all = [], noCertifier = 0, noRecords = 0,
        unusable = 0, needLevel = 0, needClarify = 0, notJourney = 0;
    var standOpts = { countingLevels: levels, licenseHistory: licHist };
    for (var i = 0; i < list.length; i++) {
      var p = list[i], r = periodRange(p, nowIdx);
      if (!r) { unusable++; continue; }
      all.push(r);
      var standing = periodStanding(p, standOpts);
      if (standing === "not_journey") { notJourney++; continue; }
      // a period that still needs clarification is reported as such — it is
      // neither counted nor silently dropped to zero (owner spec 2026-09-10 §7)
      if (standing === "clarify") {
        needClarify++;
        if (needsLevelReview(p)) needLevel++;
        clarify.push(r);
      } else if (p.ft === "pt") {
        // Part-time time is kept apart, never scaled by an invented divisor:
        // 13A-11 says "Do not claim credit for full-time work if applicant
        // worked only part-time" and illustrates it with half-time → half the
        // years, but it publishes no hours-per-week definition, so the
        // conversion is the applicant's and CSLB's to make, not ours.
        partTime.push(r);
      } else counting.push(r);
      if (p.certifier !== "y") noCertifier++;
      if (p.records !== "y" && p.records !== "part") noRecords++;
    }

    function clip(ranges) {
      if (!windowYears) return ranges;
      var minIdx = nowIdx - windowYears * 12 + 1, out = [];
      for (var j = 0; j < ranges.length; j++) {
        var s = Math.max(ranges[j][0], minIdx), e = ranges[j][1];
        if (e >= s) out.push([s, e]);
      }
      return out;
    }
    var clipped = clip(counting);

    var mergedAll = mergeRanges(all);
    var claimedMonths = rangeMonths(mergedAll);
    var inWindowMonths = rangeMonths(mergeRanges(clipped));
    var allCountingMonths = rangeMonths(mergeRanges(counting));
    var countingMonths = minWithin ? allCountingMonths : inWindowMonths;
    // Part-time months that overlap counted full-time months are already
    // covered by them, so only the remainder is reported separately.
    var partTimeMonths = minWithin
      ? rangeMonths(mergeRanges(counting.concat(partTime))) - countingMonths
      : rangeMonths(mergeRanges(clip(counting.concat(partTime)))) - countingMonths;
    // months that still need clarification, inside the same window and not
    // already covered by potentially qualifying months (each month once)
    var clarifyMonths = minWithin
      ? rangeMonths(mergeRanges(counting.concat(clarify))) - allCountingMonths
      : rangeMonths(mergeRanges(clip(counting.concat(clarify)))) - inWindowMonths;

    return {
      periods: list.length,
      unusablePeriods: unusable,
      claimedMonths: claimedMonths,
      claimedYears: Math.round((claimedMonths / 12) * 10) / 10,
      countingMonths: countingMonths,
      countingYears: Math.round((countingMonths / 12) * 10) / 10,
      // reported next to the estimate, never folded into it
      partTimeMonths: partTimeMonths,
      // the part of the estimate inside the look-back window, and whether a
      // state's minimum inside that window is still short (never a verdict)
      countingInWindowMonths: inWindowMonths,
      windowShort: !!(minWithin && countingMonths > 0 && inWindowMonths < minWithin * 12),
      // the "needs clarification" bucket (never a verdict, never a zero)
      clarifyMonths: clarifyMonths,
      periodsNeedingClarification: needClarify,
      periodsNeedingLevel: needLevel,
      periodsNotJourney: notJourney,
      // Overlapping months are a normal fact (two jobs at once), not an error:
      // the union counts each calendar month once instead of adding periods up.
      overlap: hasOverlap(all),
      outsideWindowMonths: allCountingMonths - inWindowMonths,
      periodsWithoutCertifier: noCertifier,
      periodsWithoutRecords: noRecords,
      // What is left to review before the packet is worth sending. NOT an
      // eligibility test — the agency decides whether the experience counts.
      openItems: (unusable ? 1 : 0) + (noCertifier ? 1 : 0) + (noRecords ? 1 : 0) +
                 (hasOverlap(all) ? 1 : 0)
    };
  }

  /* Inclusive whole months between two YYYY-MM values ("current" = now).
     Returns null for unusable input — the UI shows an error, never a guess.
     No rounding UP: 8 years 8 months stays 8y8m (spec: never inflate). */
  function periodMonths(from, to, nowMonthIdx) {
    var s = monthIndex(from);
    var e = (to === "current" || !to) ? nowMonthIdx : monthIndex(to);
    if (s === null || e === null || e < s) return null;
    return e - s + 1;
  }

  function durationParts(months) {
    if (months === null || months < 0) return null;
    return { years: Math.floor(months / 12), months: months % 12 };
  }

  /* Field-level validation for one experience period. Returns error keys the
     UI maps to localized messages UNDER the offending field. */
  function periodErrors(p, nowMonthIdx, opts) {
    var errs = {};
    var s = monthIndex(p && p.from);
    if (s === null) errs.from = "required";
    else if (s > nowMonthIdx) errs.from = "future";
    var cur = p && (p.to === "current");
    if (!cur) {
      var e = monthIndex(p && p.to);
      if (e === null) errs.to = "required";
      else if (e > nowMonthIdx) errs.to = "future";
      else if (s !== null && e < s) errs.to = "before_start";
    }
    // non-licensed self-employment answers the journey-level question instead
    // of picking a level (owner spec 2026-09-10 §3)
    if (opts && opts.selfJourney) { if (p && !p.jl) errs.jl = "required"; }
    else if (p && !p.level) errs.level = "required";
    if (p && !p.cap) errs.cap = "required";
    return errs;
  }

  /* ── Reciprocity applicability (CSLB, Reciprocity Requirements, 2026-09-05)
     An out-of-state licence counts ONLY when the published conditions hold:
     a reciprocal state, an active licence in good standing for the previous
     five years, and a classification on that state's reciprocal list (the
     list itself is UNKNOWN here, so it is not checked — CSLB confirms). Even
     then the application is the ORIGINAL one; CSLB may waive the trade exam
     and retains the right to require it; Law & Business stays. */
  function reciprocityApplies(a, rec) {
    a = a || {};
    if (a.otherStateLicense !== "y") return { ok: false, reasons: ["none"] };
    if (!rec) return { ok: false, reasons: ["no_rule"] };
    var reasons = [];
    if (!rec.states || rec.states.indexOf(a.otherStateId) < 0) reasons.push("state");
    if (a.recipYears !== "5plus") reasons.push("years");
    if (a.recipGood !== "y") reasons.push("good");
    return { ok: reasons.length === 0, reasons: reasons };
  }

  /* ── Application type ─────────────────────────────────────────────────────
     Derived from the answers that are LIVE for the branch: details of a
     licence the user says never existed, or a role pruned with it, never
     steer the path (spec 2026-09-05 §2B). A confirmed type wins. */
  function deriveAppType(a, cfg) {
    a = a || {}; cfg = cfg || {};
    if (a.appTypeConfirmed) return a.appTypeConfirmed;
    var hist = a.hist, role = a.role, goal = a.goal;
    var licensed = !!hist && hist !== "h_none";
    if (!licensed) return reciprocityApplies(a, cfg.reciprocity).ok ? "reciprocity" : "original";
    if (role === "r_owner_rme") {
      if (goal === "g_replace_rme") return "replace_qualifier";
      if (goal === "g_add_class") return "add_class";
      if (goal === "g_own_license") return "original";
      return "replace_qualifier";           // "prepare in case the RME leaves"
    }
    if (role === "r_qual" && goal === "g_add_class") return "add_class";
    if (hist === "h_expired") {
      // CSLB: an expired licence is renewable within five years of expiration;
      // after that, an Application for Original License (Failing to Renew,
      // read 2026-09-05). Without a verified rule for the state: reapply.
      if (cfg.expired && a.expiredWithin === "lt5") return "renew";
      return "reapply";
    }
    if (hist === "h_suspended") return "clear_suspension";
    if (hist === "h_inactive") return "reapply";      // legacy v2 value
    // an active licence in another role, or a previous qualifier: a licence
    // of one's own is an original application (waiver review separate)
    return "original";
  }

  /* ── Waiver candidacy (BPC 7065.1) ────────────────────────────────────────
     Returns the waiver branches whose OWN stated conditions the user's answers
     do not already rule out, each with the full condition list to review. It
     never says a waiver applies: all three forms are the Registrar's
     discretion, and time alone (e.g. "five years as an owner") produces
     nothing. Ownership is never treated as qualifying experience or as
     qualifier status. */
  function waiverCandidates(a, waivers) {
    a = a || {};
    var out = [];
    (waivers || []).forEach(function (w) {
      var ok = false;
      if (w.key === "personnel_5of7")
        ok = (a.listed5of7 === "y") && (a.sameClassAsLicense === "y");
      if (w.key === "family_business")
        ok = (a.familyMember === "y") && (a.familyActive5of7 === "y") &&
             (a.familyContinuity === "y") && (a.sameClassAsLicense === "y");
      if (w.key === "replace_qualifier_5of7")
        ok = (a.employed5of7 === "y") && (a.supervisory === "y") &&
             (a.entityLicenseActive === "y") && (a.entityWaiverIn5y !== "y");
      // Arizona, A.R.S. 32-1122(F): the Registrar waives the examination when
      // its records show the person was the qualifying party in the same
      // classification within the preceding five years — ROC's records decide.
      if (w.key === "prior_qp_5y")
        ok = (a.priorQP === "y") && (a.priorQP5y === "y");
      // Nevada (NSCB License Examinations, 2026-09-11): a qualified individual
      // on another Nevada license in the same classification within the last
      // four years generally is not re-examined — the Board's records decide.
      if (w.key === "prior_qi_4y")
        ok = (a.priorQP === "y") && (a.priorQP5y === "y");
      if (ok) out.push({ key: w.key, section: w.section, needs: w.needs });
    });
    return out;
  }

  /* ── Exam plan ────────────────────────────────────────────────────────────
     Law & Business is NEVER switched off merely because the user or the
     company already holds a license (spec §"Exam logic"). The only verified
     path that touches it is reciprocity, and even there CSLB still requires it
     unless it was passed within the last five years — and the outcome is the
     agency's to confirm. Values: "required" | "may_waive". */
  function examPlan(a, cfg) {
    a = a || {}; cfg = cfg || {};
    var rec = cfg.reciprocity || null;
    var plan = { law: "required", trade: "required", reasons: [] };

    var isRecip = reciprocityApplies(a, rec).ok;

    if (isRecip) {
      plan.trade = "may_waive";
      plan.reasons.push("reciprocity_trade");
      var within = rec ? rec.lawExamStillRequiredUnlessPassedWithinYears : null;
      if (within && a.lawPassedWithinYears === "y") {
        plan.law = "may_waive";
        plan.reasons.push("reciprocity_law_recent");
      } else {
        plan.reasons.push("reciprocity_law_still_required");
      }
    }
    // A 7065.1 waiver is applied for on its own form and can cover both exams
    // (13A-1, "Examination Waivers and Exemptions"). Still only "may".
    if ((a.waiverCandidates || []).length) {
      plan.trade = "may_waive";
      plan.law = "may_waive";
      plan.reasons.push("waiver_7065_1");
    }
    return plan;
  }

  /* An exam requirement is met by a PASS or by a waiver the agency has
     CONFIRMED. "May qualify" and "waiver requested" are not results. */
  function examDone(status) { return status === "x_pass" || status === "x_waived"; }

  /* ── Event steps (owner spec 2026-09-11) ───────────────────────────────────
     Five cards report a FACT, not preparation progress: the application was
     submitted, the agency accepted it, fingerprinting is done, the required
     exams are passed, the license is issued. Their "completed" IS the fact,
     so a card and the answers must never disagree about it. */
  var EVENT_STEPS = ["submit_application", "application_review", "fingerprinting",
                     "schedule_pass_exams", "license_issued"];
  function isEventStep(key) { return EVENT_STEPS.indexOf(key) >= 0; }
  /* Do the answers record that this event happened? tradeRequired — is a
     trade exam part of the path (a classification without one has nothing
     to pass on that side). */
  function eventDone(key, a, tradeRequired) {
    a = a || {};
    var submitted = a.appSubmitted === "a_yes";
    if (key === "submit_application") return submitted;
    if (key === "application_review") return submitted && a.appStatus === "st_accepted";
    if (key === "fingerprinting") return a.fingerStatus === "fp_done";
    if (key === "schedule_pass_exams") return examDone(a.lawStatus) && (!tradeRequired || examDone(a.tradeStatus));
    if (key === "license_issued") return a.issued === "y";
    return false;
  }
  /* Hand-set marks that contradict the answers — the card says one thing
     about the event, the answers the other. Nothing is guessed: the caller
     asks the user which is right (spec §7). */
  function eventConflicts(steps, a, tradeRequired) {
    return EVENT_STEPS.filter(function (k) {
      var s = steps && steps[k];
      if (!s || !s.manual) return false;
      return (s.status === "completed") !== eventDone(k, a, tradeRequired);
    });
  }

  /* ── Qualifier disassociation clock (BPC 7068.2) ──────────────────────────
     A first-class date, not a note: when the RME leaves, the license is
     suspended (or the classification removed) 90 days later. */
  function disassociationDeadline(a, cfg) {
    if (!a || !cfg || !a.rmeLeftAt) return null;
    var due = addDays(a.rmeLeftAt, cfg.replaceDays);
    if (!due) return null;
    return { date: due, kind: "rme_replace", days: cfg.replaceDays };
  }

  /* ── Multi-state identity ─────────────────────────────────────────────────
     v2 stored one roadmap per user under "lp:roadmap:ca" and loaded the most
     recently updated row REGARDLESS of state, so opening the California page
     after saving a Nevada roadmap loaded Nevada answers and the next save
     overwrote that row. Identity now carries the state and the classification.  */
  function storageKey(state, trade) {
    return "lp:roadmap:" + String(state || "ca") + (trade ? ":" + trade : "");
  }

  function sameRoadmap(row, state, trade) {
    if (!row) return false;
    if (String(row.state) !== String(state)) return false;
    if (!trade) return true;
    return String(row.license_type || row.trade || "") === String(trade);
  }

  return {
    parseDate: parseDate, fmtDate: fmtDate, addDays: addDays, addMonths: addMonths,
    periodMonths: periodMonths, durationParts: durationParts, periodErrors: periodErrors,
    daysBetween: daysBetween, monthIndex: monthIndex, monthIndexOf: monthIndexOf,
    COUNTING_LEVELS: COUNTING_LEVELS, isCountingLevel: isCountingLevel,
    LEGACY_ARRANGEMENT_LEVELS: LEGACY_ARRANGEMENT_LEVELS, needsLevelReview: needsLevelReview,
    SELF_CAPS: SELF_CAPS, isSelfSetting: isSelfSetting, periodStanding: periodStanding,
    periodRange: periodRange, mergeRanges: mergeRanges, rangeMonths: rangeMonths,
    hasOverlap: hasOverlap, experienceReadiness: experienceReadiness,
    deriveAppType: deriveAppType, reciprocityApplies: reciprocityApplies, examDone: examDone,
    EVENT_STEPS: EVENT_STEPS, isEventStep: isEventStep, eventDone: eventDone, eventConflicts: eventConflicts,
    waiverCandidates: waiverCandidates,
    examPlan: examPlan, disassociationDeadline: disassociationDeadline,
    storageKey: storageKey, sameRoadmap: sameRoadmap
  };
});

</script>

    examFactsNote: "Nevada: exams are given by PSI after NSCB issues exam eligibility. The CMS exam has 60 scored questions in 120 minutes, 45 correct (75%) passes, open book (Construction Business and Law Manual for Nevada); trade exams are closed book. PSI fee $95 for one portion, $140 for two; three attempts with two weeks between them — after a third failure the application is void and you reapply after 30 days.",

<script>

  var STEPS = R.steps || [];

  var STATUS_SET = ["not_started", "action_needed", "in_progress", "waiting", "review_needed", "completed"];
  var session = null;

  var statePaths = (typeof LICENSE_PATHS !== "undefined")

  function pathById(id) { for (var i = 0; i < statePaths.length; i++) if (statePaths[i].id === id) return statePaths[i]; return null; }
  function tradeCourseOf(pathId) {

  function newModel(answers) {

  function migrate(a) {
    if (!a) return {};

    if (!(a.intakeV >= 4)) {

      if (["stg_exam", "stg_p1", "stg_pall"].indexOf(a.appStage) >= 0) a.appStage = "stg_acc";

    }

  }
  function migrateV2(a) {
    var idx = STAGES.indexOf(a.stage); if (idx < 0) idx = 0;
    if (idx >= 3) a.appSubmitted = "a_yes";
    else if (a.appSubmitted !== "a_yes") a.appSubmitted = "a_no";
    if (idx >= 4 && a.appStatus !== "st_correction" && a.appStatus !== "st_rejected") a.appStatus = "st_accepted";
    if (idx >= 9) a.issued = "y";
    if (a.exams === "e_law" || a.exams === "e_both" || idx >= 7) a.lawStatus = "x_pass";
    else if (a.exams === "e_sched") a.lawStatus = "x_sched";
    else if (!a.lawStatus) a.lawStatus = "x_not";
    if (a.exams === "e_trade" || a.exams === "e_both" || idx >= 7) a.tradeStatus = "x_pass";
    else if (a.exams === "e_sched") a.tradeStatus = "x_sched";
    else if (!a.tradeStatus) a.tradeStatus = "x_not";
    if (a.finger === "f_yes") a.fingerStatus = "fp_done";
    else if (a.finger === "f_no") a.fingerStatus = (idx >= 4) ? "fp_req" : "fp_not";
    else if (!a.fingerStatus) a.fingerStatus = "fp_not";
    a.intakeV = 2;
  }

  /* V3: experience status reads the Experience Builder. A period nobody can
     certify is the blocker CSLB actually rejects on, so it outranks volume.
     Since 2026-09-10 the first pass asks ONE preliminary question (expQuick):

     is never read as the agency's approval or as progress. */
  function expState(a) {
    var q = a.expQuick || null, st;
    // A v2 roadmap stored experience as single answers (years/certifier/
    // records), not periods. Until the user rebuilds it in the Experience

    // must not silently stop being a blocker.
    if ((!a.exp || !a.exp.length) && (a.years || a.certifier)) {
      st = { r: null, certGap: a.certifier === "c_no" || a.certifier === "c_notyet", thin: a.years !== "y4" };
    } else {
      var r = expReadiness(a.exp, a);

    st.blocked = st.certGap;

  }
  function subFlags(a) {
    var submitted = a.appSubmitted === "a_yes";

             issued: a.issued === "y",

  /* Step statuses from the v2 intake — the questionnaire and the roadmap

      st.experience = f.accepted ? "completed" : "waiting";
      st.application_review = f.accepted ? "completed" : "waiting";

        st.prepare_application = "action_needed"; st.submit_application = "action_needed";
        st.application_review = "not_started";

      // progress; only "not sure" is an open action (owner spec 2026-09-10 §1–2)

  }

  /* The Application Assistant's draft for THIS state, if any: its status

  function appDraftStatus() {

  }
  /* Statuses follow the answers — the single source of truth — every time

  /* While a hand-set mark and the answers disagree about an event, the

    });

    var a = RM.answers || {};

  }

    var xs = expState(a);
    if (xs.certGap || xs.quick === "xq_no" || xs.quick === "xq_unsure" ||

  }

    var out = [];
    if (law) out.push(examCta(R.lawCourse, d.startLaw));

  function rtwItems(a) {
    return (R.rtw || []).filter(function (it) { return it.when(a); });
  }

  /* Derived CSLB deadlines (never invented — rules verified live 2026-08-29,
     sources in roadmap-config.js): a returned application must be corrected
     within 90 days of the return date; all exams must be passed within
     18 months of acceptance. */
  /* Date-only maths lives in roadmap-logic.js and stays in UTC end to end —
     the previous local-setter version shifted every derived deadline by a day
     west of UTC and shifted it inconsistently across DST. */
  var addDays = RML.addDays, addMonths = RML.addMonths;
  function deadlines(a) {
    var f = subFlags(a), out = [];
    // only the deadlines this state's verified rules define — never borrowed
    if (R.correctionDays && a.appStatus === "st_correction" && a.corrAt) {
      var cd = addDays(a.corrAt, R.correctionDays);
      if (cd) out.push({ date: cd, label: d.dateKindCorr, deadline: true });
    }
    if (R.examWindowMonths && f.accepted && !f.issued && a.appAcceptedAt && !(f.lawP && f.tradeP)) {
      var xd = addMonths(a.appAcceptedAt, R.examWindowMonths);
      if (xd) out.push({ date: xd, label: d.dateKindWindow, deadline: true });
    }

    var rme = RML.disassociationDeadline(a, R.disassociation);
    if (rme && !f.issued) out.push({ date: rme.date, label: d.dateKindRme, deadline: true });
    return out;
  }

  /* NEXT IMPORTANT DATE — nearest upcoming workflow date (exams, Live Scan,

     skipped: it is returned with over=true so the dashboard shows the
     overdue state instead of silence (LLICENA#188 gap G2). */
  function nextDate(a) {
    var c = deadlines(a);
    if (a.lawStatus === "x_sched" && a.lawDate) c.push({ date: a.lawDate, label: d.dateKindLaw });
    if (a.tradeStatus === "x_sched" && a.tradeDate)
      c.push({ date: a.tradeDate, label: fill(d.dateKindTrade, { name: tradeName(a.trade) || "Trade" }) });
    if (a.fingerStatus === "fp_sched" && a.fingerSchedAt) c.push({ date: a.fingerSchedAt, label: d.dateKindFp });
    // calendar days from the user's local "today" — no instants, no zone drift
    var today = todayIso();
    var best = null, overdue = null;
    c.forEach(function (x) {
      var diff = RML.daysBetween(today, x.date);
      if (diff === null) return;
      if (diff < 0) {
        if (x.deadline && (!overdue || diff < overdue.diff)) overdue = { diff: diff, label: x.label, date: x.date };
        return;
      }
      if (!best || diff < best.diff) best = { diff: diff, label: x.label, date: x.date, deadline: !!x.deadline };
    });
    if (overdue) { overdue.days = -overdue.diff; overdue.over = true; return overdue; }
    if (best) best.days = best.diff;
    return best;
  }

  /* LICENA's RECOMMENDED next action from the v2 answers — the intelligence
     layer (spec §20): current position ≠ next action ≠ parallel action.
     Returns { key, t, b, wait, par, rtw, ctas, src }. */
  function recommendNext(m) {
    var a = m.answers || {};
    var f = subFlags(a);
    var s = m.steps;
    function done(k) { return s[k] && s[k].status === "completed"; }
    if (f.issued) {
      var pend = rtwItems(a).filter(function (it) { return !(a.rtw || {})[it.key]; });
      if (pend.length) return { key: "license_issued", t: d.nx_rtw_t, b: d.nx_rtw_b, rtw: true, ctas: [] };
      return { key: "license_issued", t: d.nx_done_t, b: d.nx_done_b, rtw: true, ctas: [] };
    }
    // renewal and clearing a suspension are their own procedures, not a new
    // application (CSLB renewal pages, 2026-09-05)
    var at = appType(a);
    if (at === "renew")
      return { key: "prepare_application", t: d.nx_renew_t, b: d.nx_renew_b, src: R.expired && R.expired.source, ctas: [] };
    if (at === "clear_suspension")
      return { key: "prepare_application", t: d.nx_susp_t, b: d.nx_susp_b, src: R.suspendedSource, ctas: [] };
    // A CSLB correction or a returned application beats everything else
    if (a.appStatus === "st_correction" && s.application_review.status === "action_needed")
      return { key: "application_review", t: d.nx_corr_t, b: d.nx_corr_b, ctas: [] };
    if (a.appStatus === "st_rejected" && s.prepare_application.status === "action_needed")
      return { key: "prepare_application", t: d.nx_rej_t, b: d.nx_rej_b, ctas: [] };
    // Final phase — both exams passed (in an exams-first state the
    // application still has to be filed first)
    if (f.lawP && f.tradeP && !(R.examsFirst && !f.submitted)) {
      if (s.final_requirements.status === "in_progress")
        return { key: "final_requirements", t: d.nx_waitiss_t, b: d.nx_waitiss_b, wait: true,
                 src: stepByKey("license_issued").source, ctas: [] };
      return { key: "final_requirements", t: d.nx_final_t, b: d.nx_final_b, ctas: [] };
    }
    // a REQUESTED waiver is not a result: wait for the agency's decision
    if (a.lawStatus === "x_wreq" || a.tradeStatus === "x_wreq")
      return { key: "schedule_pass_exams", t: d.nx_wreq_t, b: d.nx_wreq_b, wait: true, ctas: [] };
    // A failed exam → targeted retake preparation (21-day wait, 18 months)
    if (a.lawStatus === "x_fail" || a.tradeStatus === "x_fail") {
      var lawFail = a.lawStatus === "x_fail";
      return { key: lawFail ? "prep_law_business" : "prep_trade",
               t: fill(d.nx_retake_t, { name: lawFail ? d.lawShort : tradeName(m.trade) }),
               b: d.nx_retake_b, ctas: prepCtas(lawFail, !lawFail) };
    }
    // One exam passed → the remaining one is the whole game
    if (f.lawP !== f.tradeP) {
      var lawLeft = !f.lawP;
      if (!lawLeft && m.notSure)
        return { key: "classification", t: d.t_classification, b: d.nsFlag, ctas: [] };
      return { key: lawLeft ? "prep_law_business" : "prep_trade", t: d.nx_remain_t,
               b: fill(d.nx_remain_b, { name: lawLeft ? d.lawShort : tradeName(m.trade) }),
               ctas: prepCtas(lawLeft, !lawLeft) };
    }
    // Classification not settled: clarifying it is the first move (§1)
    if (m.notSure && !done("classification"))
      return { key: "classification", t: d.nx_class_t, b: d.nsFlag,
               ctas: f.submitted ? prepCtas(true, false) : [] };
    // exams-first states (Arizona): until both exams are passed, preparing for
    // them is the move — the application is filed afterwards with the score
    // report (PSI bulletin, 2026-09-11)
    if (R.examsFirst && !f.submitted && !(f.lawP && f.tradeP)) {
      var schedX = a.lawStatus === "x_sched" || a.tradeStatus === "x_sched";
      return { key: done("prep_law_business") ? "prep_trade" : "prep_law_business",
               t: schedX ? d.nx_sched_t : d.nx_prep_t, b: schedX ? d.nx_sched_b : d.nx_prep_b,
               ctas: prepCtas(!done("prep_law_business"), !done("prep_trade")) };
    }
    if (s.fingerprinting.status === "action_needed")
      return { key: "fingerprinting", t: d.t_fingerprinting, b: d.todo_fingerprinting, par: true,
               ctas: prepCtas(!done("prep_law_business"), !done("prep_trade")) };
    if (f.accepted) {
      var sched = a.lawStatus === "x_sched" || a.tradeStatus === "x_sched";
      return { key: done("prep_law_business") ? "prep_trade" : "prep_law_business",
               t: sched ? d.nx_sched_t : d.nx_prep_t, b: sched ? d.nx_sched_b : d.nx_prep_b,
               ctas: prepCtas(!done("prep_law_business"), !done("prep_trade")) };
    }
    if (f.submitted)
      return { key: "application_review", t: d.nx_wait_t, b: d.nx_wait_b, wait: true,
               ctas: prepCtas(!done("prep_law_business"), !done("prep_trade")) };
    // Not submitted: the missing certifier is the classic delay — surface it;
    // otherwise the preliminary experience answer names the block's own next
    // move (owner spec 2026-09-10) — never an approval, never progress
    var xs = expState(a);
    if (xs.certGap)
      return { key: "experience", t: d.nx_cert_t, b: d.nx_cert_b, par: true, ctas: prepCtas(true, true) };
    if (xs.quick === "xq_unsure" || xs.quick === "xq_no") {
      var qk = xs.quick.slice(3);
      return { key: "experience", t: d["xqAct_" + qk + "_t"], b: d["xqAct_" + qk + "_b"], par: true, ctas: prepCtas(true, true) };
    }
    // periods entered but the preliminary estimate is not settled (a period
    // still needs clarification, or the time entered is short): the details
    // come first — the application draft may continue in parallel (§1)
    if ((a.exp || []).length && xs.r && (xs.r.periodsNeedingClarification > 0 || xs.thin))
      return { key: "experience", t: d.nx_expclar_t, b: d.nx_expclar_b, par: true, ctas: prepCtas(true, true) };
    return { key: "prepare_application", t: d.t_prepare_application, b: d.todo_prepare_application,
             par: true, ctas: prepCtas(true, !m.notSure) };
  }

  /* ---------- persistence ---------- */
  function saveLocal(m) { if (DEMO) return; try { localStorage.setItem(lsKey(), JSON.stringify(m)); } catch (_) {} }
  /* saveLocal writes under the state+classification key, but at boot the
     classification is not known yet — so scan every key of THIS state and
     take the most recently updated roadmap. The legacy "lp:roadmap:ca" key
     (no classification) matches the same prefix and competes on updatedAt,
     so an old record can never shadow a newer save. Other states' keys never
     match — the multi-state separation stays intact. */
  function loadLocal() {
    try {
      var pref = RML.storageKey(STATE), best = null;
      for (var n = 0; n < localStorage.length; n++) {
        var k = localStorage.key(n);
        if (k !== pref && k.indexOf(pref + ":") !== 0) continue;
        var m = JSON.parse(localStorage.getItem(k) || "null");
        if (m && m.answers && (!best || String(m.updatedAt || "") > String(best.updatedAt || ""))) best = m;
      }
      return best;
    } catch (_) { return null; }
  }

  function dbSave(m) {
    if (DEMO || !session || typeof supa === "undefined") return Promise.resolve();
    var rec = recommendNext(m);
    var a = m.answers || {};
    var row = { user_id: session.user.id, state: m.state, license_type: m.trade,
                license_not_sure: !!m.notSure, answers: m.answers, status: "active",
                current_step: rec ? rec.key : currentStepOf(m), progress_percent: progressOf(m) };
    // v2: first-class workflow dates/fields (license-roadmaps-v2.sql). If the
    // owner hasn't applied that SQL yet, the extended row fails — fall back
    // to the v1 row so saving never breaks (answers jsonb keeps everything).
    var ext = { entity_type: a.entity || null, entity_name: a.entityName || null,
                dba: a.dba === "y", license_number: a.newLicenseNumber || a.licenseNumber || null,
                reminder_opt_in: a.reminders === "rem_yes" };
    Object.keys(window.ROADMAP_DATE_COLUMNS).forEach(function (k) {
      ext[window.ROADMAP_DATE_COLUMNS[k]] = a[k] || null;
    });
    Object.keys(window.ROADMAP_TEXT_COLUMNS).forEach(function (k) {
      ext[window.ROADMAP_TEXT_COLUMNS[k]] = a[k] || null;
    });
    var full = {}; Object.keys(row).forEach(function (k) { full[k] = row[k]; });
    Object.keys(ext).forEach(function (k) { full[k] = ext[k]; });
    function saveRow(r) {
      return m.id
        ? supa.from("license_roadmaps").update(r).eq("id", m.id).select("id").single()
        : supa.from("license_roadmaps").insert(r).select("id").single();
    }
    function afterRow(res) {
      if (res.error || !res.data) return;
      m.id = res.data.id;
      var stepRows = STEPS.map(function (s) {
        return { roadmap_id: m.id, step_key: s.key, step_order: s.order,
                 status: m.steps[s.key].status, completed_at: m.steps[s.key].completed_at,
                 // a hand-set mark must survive a load from the server, or the
                 // re-derivation would silently undo it (metadata jsonb column)
                 metadata: m.steps[s.key].manual ? { manual: true } : {} };
      });
      return supa.from("license_roadmap_steps").upsert(stepRows, { onConflict: "roadmap_id,step_key" });
    }
    return saveRow(full).then(function (res) {
      if (res.error) return saveRow(row).then(afterRow);
      return afterRow(res);
    }).catch(function () {});
  }

  function dbLoad() {
    if (DEMO || !session || typeof supa === "undefined") return Promise.resolve(null);
    return supa.from("license_roadmaps").select("*").eq("user_id", session.user.id)
      .eq("status", "active").eq("state", STATE)
      .order("updated_at", { ascending: false }).limit(20)
      .then(function (res) {
        if (res.error || !res.data || !res.data.length) return null;
        // Prefer this page's classification when the user keeps several
        // roadmaps in the same state; never adopt another state's row.
        var want = (W && W.a && W.a.trade) || null;
        var r = null, i;
        for (i = 0; i < res.data.length && want; i++)
          if (RML.sameRoadmap(res.data[i], STATE, want)) { r = res.data[i]; break; }
        if (!r) for (i = 0; i < res.data.length; i++)
          if (RML.sameRoadmap(res.data[i], STATE, null)) { r = res.data[i]; break; }
        if (!r) return null;
        return supa.from("license_roadmap_steps").select("*").eq("roadmap_id", r.id).then(function (sr) {
          var m = { id: r.id, state: r.state, trade: r.license_type, notSure: r.license_not_sure,
                    answers: r.answers || {}, steps: {}, updatedAt: r.updated_at };
          STEPS.forEach(function (s) { m.steps[s.key] = { status: "not_started", completed_at: null }; });
          (sr.data || []).forEach(function (row) {
            if (m.steps[row.step_key]) {
              m.steps[row.step_key] = { status: row.status, completed_at: row.completed_at };
              if (row.metadata && row.metadata.manual) m.steps[row.step_key].manual = true;
            }
          });
          return m;
        });
      }).catch(function () { return null; });
  }

  function persist(m) { m.updatedAt = new Date().toISOString(); saveLocal(m); dbSave(m); }

  /* ---------- CONVERSATIONAL INTAKE V3 (owner spec 2026-09-04) -------------
     The questionnaire is a CONVERSATION, not a stack of state forms: exactly
     one question is open, answering it reveals the next RELEVANT question and
     folds the answered one into a "✓ answer · Change" row. There is no Back
     button and no "Step X of N" — editing any earlier row recalculates the
     branch and drops the answers that stopped being relevant.
     Buttons exist only where the spec allows one: "Save this work period",
     "Add another period", "Done" in the month picker, "Save" for optional
     details, and the single final "Show my plan". */
  var W = { a: {}, edit: null, reveal: null, errs: null };
  var REVEAL_MS = 350;
  var REDUCED = (function () {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch (_) { return false; }
  })();
  var FOCUSABLE = "button, input, select, textarea, a[href], details";
  /* The Experience Builder opened FROM THE PLAN (owner spec 2026-09-10): the
     detail units paint into the experience step card and edit the plan's own
     answers; every change persists and re-derives that one step in place. */
  var PANEL = null;

  function subm(a) { return a.appSubmitted === "a_yes"; }
  function acc(a) { return subm(a) && a.appStatus === "st_accepted"; }
  function iss(a) { return a.issued === "y"; }
  function hasLicense(a) { return a.hist && a.hist !== "h_none"; }
  function rmeOwner(a) { return a.role === "r_owner_rme"; }
  function needsExperience(a) {

    // being established, and stops mattering once CSLB has accepted it.
    if (acc(a) || iss(a)) return false;
    // reciprocity included: an out-of-state licence does not by itself
    // replace experience documentation (spec 2026-09-05 §2E)
    return ["original", "add_class", "replace_qualifier", "new_entity", "reapply", "reciprocity"]
      .indexOf(appType(a)) >= 0;
  }
  /* "Today" is the user's LOCAL calendar day, written as a date-only value:
     late on Aug 31 in Los Angeles is already Sep 1 in UTC, and the two
     readings used to disagree at month ends. */
  function todayIso() {
    var t = new Date();
    function two(n) { return (n < 10 ? "0" : "") + n; }
    return t.getFullYear() + "-" + two(t.getMonth() + 1) + "-" + two(t.getDate());
  }
  function nowIdx() { return RML.monthIndexOf(todayIso()); }
  /* The state's experience rule applied to the entered periods — counts and
     flags only; the licensing agency decides what qualifies. */
  function licHist(a) { return hasLicense(a) || a.otherStateLicense === "y"; }
  function expReadiness(periods, a) {
    var rule = R.experience; a = a || W.a;
    return RML.experienceReadiness(periods || [], {
      windowYears: rule.withinYears, minWithinYears: rule.minWithinYears || null,
      countingLevels: rule.levels, nowMonthIdx: nowIdx(), licenseHistory: licHist(a) });
  }
  function stateNameOf(st) {
    var base = window.TRM[lang] || window.TRM.en;
    return (base["_" + st] && base["_" + st].stateName) || (st === "ca" ? base.stateName : String(st).toUpperCase());
  }
  /* Work periods entered for ANOTHER state's roadmap on this device — offered
     for reuse (owner spec 2026-09-05 §3), never copied without confirmation. */
  function foreignPeriods() {
    var best = null;
    try {
      for (var n = 0; n < localStorage.length; n++) {
        var k = localStorage.key(n), m = /^lp:roadmap:([a-z]{2})(?::|$)/.exec(k);
        if (!m || m[1] === STATE) continue;
        var obj = JSON.parse(localStorage.getItem(k) || "null");
        var ans = obj && (obj.answers || obj);
        var list = ans && ans.exp;
        if (!list || !list.length) continue;
        if (!best || list.length > best.list.length) best = { state: m[1], stateName: stateNameOf(m[1]), list: list };
      }
    } catch (_) {}
    return best;
  }
  /* A key answer changed (owner spec 2026-09-05 §3): answers given FOR the
     old classification are not deleted — their blocks reopen with a note so
     the user confirms or changes them. */
  function recheckAfter(what) {
    var ids = what === "class" ? ["appstat", "waiver"] : [];
    ids.forEach(function (id) {
      var u = unitById(id);
      if (!u || (u.when && !u.when(W.a)) || !u.main(W.a)) return;
      if (id === "appstat" && W.a.appSubmitted !== "a_yes") return;
      W.a.recheck = W.a.recheck || {}; W.a.recheck[id] = true;
      if (W.a.saved) delete W.a.saved[id];
    });
  }

  /* ---- draft persistence (spec §15: a reload must not lose the conversation) */
  function draftKey() { return RML.storageKey(STATE) + ":draft"; }
  function saveDraft() {
    if (DEMO) return;
    if (PANEL) { RM.updatedAt = new Date().toISOString(); saveLocal(RM); return; }
    try { localStorage.setItem(draftKey(), JSON.stringify(W.a)); } catch (_) {}
  }
  function loadDraft() {
    try {
      var raw = localStorage.getItem(draftKey());
      var a = raw ? JSON.parse(raw) : null;
      return (a && typeof a === "object" && Object.keys(a).length) ? a : null;
    } catch (_) { return null; }
  }
  function clearDraft() { try { localStorage.removeItem(draftKey()); } catch (_) {} }

  /* ---- units: one conversational block each ------------------------------
     main(a)      — the block's own question is answered
     needsSave(a) — the block also collects OPTIONAL details, confirmed by one
                    "Save" button (the only extra button the spec allows here)
     keep         — its answers survive a branch change (the user's own typed
                    work history is never deleted behind their back; the plan
                    already ignores it when the branch does not apply) */
  function unitById(id) {
    var all = UNITS.concat(DETAIL_UNITS);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }
  function activeUnits() {
    return UNITS.filter(function (u) { return !u.when || u.when(W.a); });
  }
  function unitDone(u) {
    if (!u.main(W.a)) return false;
    if (u.needsSave && u.needsSave(W.a) && !(W.a.saved || {})[u.id]) return false;
    return true;
  }
  /* Branches depend on each other — dropping "my role on that licence" can be
     what makes "what are you working toward" irrelevant — so keep pruning
     until nothing changes, or the second question survives its own parent. */
  function prune() {
    if (PANEL) return;   // the plan's answers were pruned when the plan was made
    for (var pass = 0; pass < UNITS.length; pass++) {
      var live = {}, cleared = false;
      activeUnits().forEach(function (u) { live[u.id] = true; });
      UNITS.forEach(function (u) {
        if (live[u.id] || u.keep) return;
        u.fields.forEach(function (f) {
          if (W.a[f] !== undefined) { stash(W.a, f); delete W.a[f]; cleared = true; }
        });
        if (W.a.saved && W.a.saved[u.id] !== undefined) { delete W.a.saved[u.id]; cleared = true; }
      });
      if (!cleared) return;
    }
  }
  function firstOpenId() {
    var list = activeUnits();
    for (var i = 0; i < list.length; i++) if (!unitDone(list[i])) return list[i].id;
    return null;
  }

  /* An answer changed. Recalculate the branch, then either reveal the next
     question (the answer completed this block) or repaint this block in place
     (the answer only revealed a follow-up inside it — never scroll for that). */
  function commit(u, opts) {
    if (PANEL) { panelRefresh(true); return; }
    if (W.a.saved && !u.main(W.a)) delete W.a.saved[u.id];
    prune();
    if (W.a.recheck && W.a.recheck[u.id] && unitDone(u)) delete W.a.recheck[u.id];
    saveDraft();
    W.errs = null;
    if ((opts && opts.local) || !unitDone(u)) { rebuild(u.id); return; }
    track("license_questionnaire_step_completed");
    var host = root.querySelector('[data-unit="' + u.id + '"]');
    if (host) host.classList.add("cv-picked");
    setTimeout(function () {
      W.edit = null;
      W.reveal = firstOpenId() || "cv-final";
      renderFlow();
    }, REDUCED ? 0 : REVEAL_MS);
  }
  /* Repaint ONE block without moving the page or losing the caret. */
  function rebuild(id) {
    if (PANEL) { panelRefresh(false); return; }
    var host = root.querySelector('[data-unit="' + id + '"]');
    var u = unitById(id);
    if (!host || !u) { renderFlow(); return; }
    var body = host.querySelector(".cv-body");
    if (!body) { renderFlow(); return; }
    var y = window.scrollY, idx = -1, ae = document.activeElement;
    if (ae && body.contains(ae))
      idx = Array.prototype.indexOf.call(body.querySelectorAll(FOCUSABLE), ae);
    body.innerHTML = "";
    u.build(body, u);
    if (window.scrollY !== y) window.scrollTo(0, y);
    if (idx >= 0) {
      var f = body.querySelectorAll(FOCUSABLE)[idx];
      if (f) { try { f.focus({ preventScroll: true }); } catch (_) { f.focus(); } }
    }
  }
  function editUnit(id) { W.edit = id; W.reveal = id; W.errs = null; renderFlow(); }

  /* ---- small builders ---------------------------------------------------- */
  function headEl(box, h, sub) {
    var t = document.createElement("h2");
    t.className = "cv-h"; t.tabIndex = -1; t.textContent = h;
    box.appendChild(t);
    if (sub) {
      var p = document.createElement("p"); p.className = "rw-sub"; p.textContent = sub;
      box.appendChild(p);
    }
  }
  function qLabel(text) { var p = document.createElement("p"); p.className = "rw-q"; p.textContent = text; return p; }
  function noteEl(text, src) {
    var p = document.createElement("p"); p.className = "rm-note";
    p.innerHTML = esc(text) + (src ? ' <a target="_blank" rel="noopener" href="' + src.url + '">' + esc(src.title) + " ↗</a>" : "");
    return p;
  }
  /* Answer cards: selected = gold border, light-gold fill, checkmark; every
     card is a real button, so hover / focus / keyboard come for free. */
  function cards(items, sel, onPick) {
    var box = document.createElement("div"); box.className = "cv-opts";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "cv-card" + (sel === it.v ? " on" : "");
      b.setAttribute("aria-pressed", String(sel === it.v));
      b.innerHTML = '<span class="cv-ct">' + esc(it.l) + "</span>" +
        (it.s ? '<span class="cv-cs">' + esc(it.s) + "</span>" : "") +
        '<span class="cv-ck" aria-hidden="true">✓</span>';
      b.addEventListener("click", function () {
        box.querySelectorAll(".cv-card").forEach(function (x) {
          x.classList.remove("on"); x.setAttribute("aria-pressed", "false");
        });
        b.classList.add("on"); b.setAttribute("aria-pressed", "true");
        onPick(it.v);
      });
      box.appendChild(b);
    });
    return box;
  }
  function yn(key, u, extra) {
    return cards([{ v: "y", l: d.a_yes }, { v: "n", l: d.a_no }], W.a[key], function (v) {
      W.a[key] = v; commit(u, extra || { local: true });
    });
  }
  function dropdown(items, sel, placeholder, onPick) {
    var s = document.createElement("select"); s.className = "rw-select";
    var ph = document.createElement("option");
    ph.value = ""; ph.textContent = placeholder; ph.disabled = true; ph.selected = !sel;
    s.appendChild(ph);
    items.forEach(function (it) {
      var o = document.createElement("option");
      o.value = it.v; o.textContent = it.l; if (sel === it.v) o.selected = true;
      s.appendChild(o);
    });
    s.addEventListener("change", function () { onPick(s.value); });
    return s;
  }
  function textInput(key, ph) {

  /* ---- month + year fields (owner spec 2026-09-05 §8) --------------------

    var wrap = document.createElement("div"); wrap.className = "rm-my";

    ySel.setAttribute("aria-label", label + " — " + d.myYear);

      var o = document.createElement("option"); o.value = v; o.textContent = text;
      if (disabled) o.disabled = true;

    opt(mSel, "", d.myMonth, true);

    opt(ySel, "", d.myYear, true);
    var thisYear = Math.floor(nowIdx() / 12);
    for (var y = thisYear; y >= YEAR_MIN; y--) opt(ySel, String(y), String(y));

      var v = get();

    function group(n, title) {

    save.textContent = d.expSavePeriod;
    save.addEventListener("click", function () {
      var errs = RML.periodErrors(p, nowIdx(), { selfJourney: selfNoLic(p) });
      showErrors(errs);
      if (Object.keys(errs).length) {

        // to the top of the page, and nothing is rebuilt

          bad.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
          var lbl = bad.previousElementSibling;

          if (f) { try { f.focus({ preventScroll: true }); } catch (_) { f.focus(); } }

        return x;

      if (!found) W.a.exp.push(p);

    function dateErrs() {

      if (p.to !== "current" && toPick.isPartial()) out.to = "incomplete";
      if (!g1done(p)) return out;

       by re-rendering what is already on screen. */
    function sync() {
      var de = dateErrs();
      errFrom.textContent = de.from ? (d["err_" + de.from] || de.from) : ""; errFrom.hidden = !de.from;
      errTo.textContent = de.to ? (d["err_" + de.to] || de.to) : ""; errTo.hidden = !de.to;
      if (g1done(p) && !de.from && !de.to && !g2.parentNode) form.appendChild(g2);

    sync();
    showErrors(W.errs || {});

  /* ---- application-stage block (spec §12) --------------------------------- */
  function applyStage(v) {

    box.appendChild(qLabel(fill(which === "law" ? d.qLawStatusL : d.qTradeStatusL, { name: label })));
    box.appendChild(cards(opts, cur, function (v) { W.a[key] = v; commit(u, { local: true }); }));
    if (cur === "x_sched") {

      field(box, d.qWhereL, textInput(wKey, d.examWherePh));

  function buildStage(box, u) {
    headEl(box, d.qStage2H);
    box.appendChild(qLabel(d.qAppSubL));
    box.appendChild(cards([{ v: "a_yes", l: d.a_yes }, { v: "a_no", l: d.a_no }], W.a.appSubmitted,
      function (v) {

          // exams-first states: the exam results exist without an application — keep them

          gone.forEach(function (k) { stash(W.a, k); delete W.a[k]; });

    box.appendChild(cards([{ v: "stg_waiting", l: d.stg_waiting }, { v: "stg_corr", l: d.stg_corr },
      { v: "stg_acc", l: d.stg_acc }, { v: "stg_issued", l: d.stg_issued },

  /* ---- the flow ----------------------------------------------------------- */
  function rowEl(u) {

  /* One compact summary at the end (owner spec 2026-09-05 §4): the answers
     that shape the plan in one line, the full list behind "All answers" —
     every row keeps its own "Change" — and the single call to action. */
  function summaryEl(all, doneN) {
    var box = document.createElement("div"); box.className = "cv-sum";
    box.setAttribute("data-unit", "cv-final");
    var h = document.createElement("h2");
    h.className = "cv-h"; h.tabIndex = -1; h.textContent = d.cvSummaryH;
    box.appendChild(h);

    ["class", "apptype", "holder", "expq", "appstat"].forEach(function (id) {
      var u = unitById(id);
      if (!u || (u.when && !u.when(W.a))) return;

      if (v) bits.push(id === "appstat" ? u.label() + ": " + v : v);
    });

    box.appendChild(sub);

    go.addEventListener("click", function () {

      // missing experience, education or documents (spec §13) — periods are

      finishWizard();

  function flowView() {
    var el = document.createElement("div"); el.className = "rw-card cv-flow";
    var list = activeUnits();
    var doneN = 0;
    list.forEach(function (u) { if (unitDone(u)) doneN++; });
    var pct = list.length ? Math.round((doneN / list.length) * 100) : 0;
    // the state comes from the page and stays in view with the classification
    var ctx = document.createElement("div"); ctx.className = "cv-ctx";
    ctx.textContent = d.stateName + (W.a.trade ? " · " + tradeName(W.a.trade) : "");
    el.appendChild(ctx);
    // opened from a plan: a way back that saves nothing (spec 2026-09-11 §2)
    if (RM) {
      var back = document.createElement("button"); back.type = "button"; back.className = "linkbtn cv-back";
      back.textContent = d.cvBackPlan;
      back.addEventListener("click", function () { FIX = null; clearDraft(); renderRoadmap(); });
      el.appendChild(back);
    }
    var prog = document.createElement("div"); prog.className = "cv-prog";
    prog.innerHTML = "<span>" + esc(d.cvProgressA) + "</span>" +
      '<div class="rw-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      pct + '" aria-label="' + esc(d.cvProgressA) + '"><i style="width:' + pct + '%"></i></div>';
    el.appendChild(prog);

    var openId = W.edit || firstOpenId();
    // once everything is answered the rows move behind "All answers", so the
    // page ends with one summary instead of the same answers listed twice
    var complete = !openId;
    var all = document.createElement("div"); all.className = "cv-all-l";
    var stop = false;
    list.forEach(function (u) {
      if (stop) return;
      var box = document.createElement("section");
      box.className = "cv-u"; box.setAttribute("data-unit", u.id);
      if (u.id === openId) {
        box.className += " cv-open";
        var body = document.createElement("div"); body.className = "cv-body";
        if (W.a.recheck && W.a.recheck[u.id]) body.appendChild(noteEl(d.recheckClassNote));
        u.build(body, u);
        box.appendChild(body);
      } else if (unitDone(u)) {
        if (u.sticky || u.display) {
          box.className += " cv-sticky";
          var b2 = document.createElement("div"); b2.className = "cv-body";
          u.build(b2, u);
          box.appendChild(b2);
        } else {
          box.className += " cv-row";
          box.appendChild(rowEl(u));
        }
      } else { stop = true; return; }
      (complete ? all : el).appendChild(box);
    });
    if (complete) el.appendChild(summaryEl(all, doneN));
    var disc = document.createElement("p");
    disc.className = "rw-disc"; disc.textContent = d.disclaimer;
    el.appendChild(disc);
    return el;
  }

  /* Re-render the conversation in place, then bring the newly revealed
     question into view and hand it the focus (spec §1/§14). */
  function renderFlow() {
    PANEL = null;
    var y = window.scrollY;
    var el = flowView();
    render(el, { keepScroll: true });
    if (window.scrollY !== y) window.scrollTo(0, y);
    var target = W.reveal; W.reveal = null;
    if (!target) return;
    var host = root.querySelector('[data-unit="' + target + '"]');
    if (!host) return;
    host.classList.add("cv-in");
    // the site bar is sticky: clear it, or the revealed question opens under it
    var bar = document.querySelector(".top");
    var barH = bar ? bar.getBoundingClientRect().height : 0;
    var top = host.getBoundingClientRect().top + window.scrollY - barH - 16;
    if (top < 0) top = 0;
    try { window.scrollTo({ top: top, behavior: REDUCED ? "auto" : "smooth" }); }
    catch (_) { window.scrollTo(0, top); }
    var h = host.querySelector(".cv-h");
    if (h) { try { h.focus({ preventScroll: true }); } catch (_) {} }
  }

  function stateUnavailable() {
    var el = document.createElement("div"); el.className = "rw-card rw-center";
    el.innerHTML = "<h2>" + esc(d.stateUnavailH) + "</h2><p class='rw-sub'>" + esc(d.stateUnavailB) + "</p>";

  function finishWizard() {
    track("license_questionnaire_completed");
    W.a.intakeV = 4;
    delete W.a.expDraft;          // an unsaved period never reaches the plan
    var prev = RM;
    RM = newModel(W.a);
    // answers edited from the plan: same plan, same saved row, the user's own
    // status marks survive; only derived statuses are recomputed (§1)
    if (prev && prev.state === RM.state && prev.trade === RM.trade) {
      RM.id = prev.id;
      STEPS.forEach(function (s) {
        var ps = prev.steps && prev.steps[s.key];
        // an event card's fact was just (re)stated in the questionnaire — the
        // answers win, a stale hand-set mark must not contradict them (§5)
        if (ps && ps.manual && !RML.isEventStep(s.key)) RM.steps[s.key] = { status: ps.status, completed_at: ps.completed_at, manual: true };
      });
    }
    OPEN = null;
    clearDraft();
    persist(RM);
    track("license_roadmap_created");
    tag("roadmap_state", RM.state); tag("roadmap_trade", RM.trade || "not_sure");
    if (W.a.entity) tag("roadmap_entity", W.a.entity);
    renderRoadmap();
  }

  /* Reopen the questionnaire WITH the plan's answers — one unit for editing,
     or the summary where every row has "Change" (§1: the button opens the
     question itself, answers kept). */
  function editAnswers(id) {
    PANEL = null;
    var copy = JSON.parse(JSON.stringify(RM.answers || {}));

    renderFlow();
  }
  /* Which step cards are open — the user's choice for this session; on the
     first view only the recommended step is open (§4). */
  var OPEN = null;

  function openKey() { return "lp:roadmap:" + STATE + ":open"; }
  function loadOpen() {
    try { var v = JSON.parse(sessionStorage.getItem(openKey()) || "null"); return Array.isArray(v) ? v : null; } catch (_) { return null; }
  }
  function saveOpen() { try { sessionStorage.setItem(openKey(), JSON.stringify(Object.keys(OPEN))); } catch (_) {} }

  /* ---- Experience Builder inside the plan (owner spec 2026-09-10) --------
     Opened by "Work through my experience": the detail units paint into the
     experience card and edit RM.answers directly — nothing already entered
     is copied, re-read into the preliminary answer, or dropped. */
  function paintPanel() {
    var box = PANEL.box; box.innerHTML = "";

      var sec = document.createElement("section");

  /* A builder change: persist, re-derive ONLY the experience step (statuses

  function panelRefresh(full) {
    var box = PANEL.box, y = window.scrollY, idx = -1, ae = document.activeElement;
    if (ae && box.contains(ae)) idx = Array.prototype.indexOf.call(box.querySelectorAll(FOCUSABLE), ae);
    W.errs = null;
    rederive(RM);
    if (full) persist(RM); else { RM.updatedAt = new Date().toISOString(); saveLocal(RM); }
    renderRoadmap("experience", true);
    var nb = root.querySelector(".rm-expb");
    if (nb && idx >= 0) {
      var f = nb.querySelectorAll(FOCUSABLE)[idx];
      if (f) { try { f.focus({ preventScroll: true }); } catch (_) { f.focus(); } }
    }
    if (window.scrollY !== y) window.scrollTo(0, y);

  function stepCard(s, open) {

      '<span class="rm-step-t">' + esc(d["t_" + s.key]) + "</span>" +

    // Precise-source overrides: when the user named their classification, the

    // renewal / clearing a suspension are their own procedures (CSLB, 2026-09-05)
    if (s.key === "prepare_application") {

        body += "<p class='rm-note'>" + esc(d.renewNote) + ' <a target="_blank" rel="noopener" href="' + R.expired.source.url + '">' + esc(R.expired.source.title) + " ↗</a></p>";

        ' <a target="_blank" rel="noopener" href="' + wcs.url + '">' + esc(wcs.title) + " ↗</a></p>";

    if (s.key === "prepare_application") {
